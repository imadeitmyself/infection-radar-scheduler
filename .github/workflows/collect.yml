name: Refresh infection radar
on:
  schedule:
    - cron: '5,20,35,50 * * * *'
    # Repository activity prevents public schedules being disabled after 60 days.
    - cron: '7 0 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: production-collection-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch the current production slot
        env:
          SCHEDULER_TOKEN: ${{ secrets.RADAR_SCHEDULER_TOKEN }}
        run: |
          test -n "$SCHEDULER_TOKEN"
          curl --fail --silent --show-error --max-time 45 --retry 2 --retry-all-errors \
            --request POST --header "Authorization: Bearer $SCHEDULER_TOKEN" \
            --header 'Content-Type: application/json' --data '{}' \
            https://infection-radar-operations-production.thibb.workers.dev/ops/schedule \
            --output "$RUNNER_TEMP/collection-dispatch.json"
          python3 - "$RUNNER_TEMP/collection-dispatch.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          print(json.dumps(result))
          if result.get('status') in ('recovery_pending', 'reconcile', 'disabled'):
              raise SystemExit('Collection requires owner recovery; no replacement workflow created')
          PY
  keepalive:
    if: github.event.schedule == '7 0 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Record scheduler maintenance activity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, datetime, json, os, urllib.request, urllib.error
          url = 'https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/contents/.scheduler-heartbeat.json'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          payload = {'message': 'Record weekly scheduler activity', 'content': base64.b64encode((json.dumps({'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat()}) + '\n').encode()).decode()}
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  payload['sha'] = json.load(response)['sha']
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          with urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(payload).encode(), headers=headers, method='PUT'), timeout=30) as response:
              print('Scheduler maintenance recorded:', response.status)
          PY
